[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coinfighter"
version = "0.1.0"
description = "Local-first cryptocurrency market research and backtesting service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.117,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "ccxt>=4.5,<5",
  "pyarrow>=21,<23",
  "httpx>=0.28,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "coinfighter*", "indicators*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
